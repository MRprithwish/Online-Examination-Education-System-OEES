{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <link rel="icon" type="image/x-icon"
          href="{% static 'assets/images/favicon.ico' %}">

    <link rel="stylesheet"
          href="{% static 'assets/css/login_register_style.css' %}">

    <title>{{ role|title }} Login</title>
</head>
<style>
    /* Reset */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

/* Background */
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#2563eb,#1e3a8a);
    padding:20px;
}

/* Center Container */
.container{
    width:100%;
    max-width:430px;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Login Card */
.form-box{
    width:100%;
    background:#fff;
    border-radius:18px;
    padding:40px 35px;
    box-shadow:0 15px 40px rgba(0,0,0,.18);
}

/* Heading */
.form-box h1{
    text-align:center;
    margin-bottom:30px;
    color:#1e3a8a;
    font-size:30px;
    font-weight:700;
}

/* Input Box */
.input-box{
    position:relative;
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    height:50px;
    border:1px solid #dcdcdc;
    border-radius:10px;
    padding:0 45px 0 15px;
    font-size:15px;
    outline:none;
    transition:.3s;
}

.input-box input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.15);
}

.input-box i{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    color:#666;
    cursor:pointer;
}

/* Forgot Password */
.forgot-link{
    text-align:right;
    margin-bottom:20px;
}

.forgot-link a{
    color:#2563eb;
    text-decoration:none;
    font-size:14px;
}

.forgot-link a:hover{
    text-decoration:underline;
}

/* Login Button */
.btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
    margin-bottom:15px;
}

.btn:hover{
    background:#1d4ed8;
}

/* Home Button */
.back-home-btn{
    width:100%;
    height:50px;
    border:2px solid #2563eb;
    background:#fff;
    color:#2563eb;
    border-radius:10px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.back-home-btn:hover{
    background:#2563eb;
    color:#fff;
}

/* Responsive */
@media (max-width:576px){

    .form-box{
        padding:30px 20px;
    }

    .form-box h1{
        font-size:26px;
    }

}
</style>


<body>

<div class="container">

    <div class="form-box login active">

        <form method="POST"
              action="{% url 'insert_login' role %}"
              id="loginForm"
              data-role="{{ role }}">

            {% csrf_token %}

            <input type="hidden"
                   name="next"
                   value="{{ request.GET.next }}">

            <h1>{{ role|title }} Login</h1>

            <div class="input-box">

                <input type="text"
                       name="lusername"
                       placeholder="{% if role == 'student' %}Roll Number{% else %}Teacher ID{% endif %}"
                       required>

                <i class="fa-solid fa-user"></i>

            </div>

            <div class="input-box">

                <input type="password"
                       name="lpassword"
                       id="login_pass"
                       placeholder="Password"
                       required>

                <i class="fa-solid fa-lock toggle-icon"
                   id="login_icon"
                   onclick="toggleSecurity('login_pass','login_icon')"></i>

            </div>

            <div class="forgot-link">
                <a href="{% url 'forgot_password' %}">
                    Forgot Password?
                </a>
            </div>

            <button type="submit" class="btn">
                Login
            </button>

            <button type="button"
                    class="back-home-btn"
                    onclick="window.location.href='{% url 'home' %}'">
                ← Home
            </button>

        </form>

    </div>

</div>

{% if messages %}
    {% for message in messages %}
        <div id="django-messages"
             data-msg="{{ message }}"
             style="display:none;">
        </div>
    {% endfor %}
{% endif %}

<script src="{% static 'assets/js/login_script.js' %}"></script>

</body>
</html>
